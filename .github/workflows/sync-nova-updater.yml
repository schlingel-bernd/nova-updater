name: Sync kiwi-updater to nova-updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clone-updater repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect upstream version
        id: version
        run: |
          git clone --depth 1 https://github.com/derlocke-ng/kiwi-updater.git /tmp/kiwi-updater
          cd /tmp/kiwi-updater
          version=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Upstream version: ${version}"

      - name: Prepare renamed copy
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          src = Path("/tmp/kiwi-updater")
          dst = Path("/tmp/nova-updater")
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)

          def rename_text_file(path: Path):
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  return
              original = text
              replacements = [
                  ("kiwi-updater", "nova-updater"),
                  ("kiwi_updater", "nova_updater"),
                  ("kiwi-gui", "nova-gui"),
                  ("kiwi-killswitch", "nova-killswitch"),
                  ("kiwi-catalog", "nova-catalog"),
                  ("kiwi-system-update", "nova-system-update"),
                  ("kiwi.manifest", "nova.manifest"),
                  ("kiwi", "nova"),
                  ("Kiwi", "Nova"),
                  ("KIWI", "NOVA"),
                  ("derlocke-ng/kiwi-updater", "schlingel-bernd/nova-updater"),
                  ("https://github.com/derlocke-ng/kiwi-updater", "https://github.com/schlingel-bernd/nova-updater"),
                  ("https://raw.githubusercontent.com/derlocke-ng/kiwi-updater", "https://raw.githubusercontent.com/schlingel-bernd/nova-updater"),
                  ("github.com/derlocke-ng/kiwi-updater", "github.com/schlingel-bernd/nova-updater"),
              ]
              for a, b in replacements:
                  text = text.replace(a, b)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          for p in dst.rglob("*"):
              if p.is_dir():
                  continue
              if ".git" in p.parts:
                  continue
              try:
                  p.read_bytes()
              except Exception:
                  continue
              try:
                  p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              rename_text_file(p)

          for p in list(dst.rglob("*")):
              if p.is_dir():
                  continue
              if ".git" in p.parts:
                  continue
              new_name = p.name
              for a, b in [
                  ("kiwi-updater", "nova-updater"),
                  ("kiwi_updater", "nova_updater"),
                  ("kiwi-gui", "nova-gui"),
                  ("kiwi-killswitch", "nova-killswitch"),
                  ("kiwi-catalog", "nova-catalog"),
                  ("kiwi-system-update", "nova-system-update"),
                  ("kiwi", "nova"),
              ]:
                  new_name = new_name.replace(a, b)
              if new_name != p.name:
                  target = p.with_name(new_name)
                  p.rename(target)
          PY

      - name: Stage renamed content
        run: |
          rsync -a --delete --exclude='.git' /tmp/nova-updater/ ./
          git add -A

      - name: Commit if needed
        id: commit
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync from kiwi-updater to nova-updater"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push to nova-updater
        if: steps.commit.outputs.changed == 'true'
        env:
          NOVA_PAT: ${{ secrets.NOVA_PAT }}
        run: |
          if [[ -z "$NOVA_PAT" ]]; then
            echo "::error::NOVA_PAT secret is not configured"
            exit 1
          fi
          git remote remove origin || true
          git remote add origin https://x-access-token:${NOVA_PAT}@github.com/schlingel-bernd/nova-updater.git
          git push origin HEAD:main --force

      - name: Create GitHub release
        if: steps.commit.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.NOVA_PAT }}
          repository: schlingel-bernd/nova-updater
          tag_name: ${{ steps.version.outputs.version }}
          name: Nova Updater ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false