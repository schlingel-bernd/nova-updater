       turn to noise below 24px, which is exactly where a panel icon lives.
       No gradients, bevels or shadows. -->
  <circle cx="64" cy="64" r="58" fill="#5E8C2E"/>
  <circle cx="64" cy="64" r="51" fill="#A7CE63"/>
  <circle cx="64" cy="64" r="18" fill="#F4F9EA"/>
  <g fill="#2F4C14">
    <ellipse cx="64" cy="33" rx="4" ry="5.6"/>
    <ellipse cx="90.8" cy="48.5" rx="4" ry="5.6" transform="rotate(60 90.8 48.5)"/>
    <ellipse cx="90.8" cy="79.5" rx="4" ry="5.6" transform="rotate(120 90.8 79.5)"/>
    <ellipse cx="64" cy="95" rx="4" ry="5.6"/>
    <ellipse cx="37.2" cy="79.5" rx="4" ry="5.6" transform="rotate(60 37.2 79.5)"/>
    <ellipse cx="37.2" cy="48.5" rx="4" ry="5.6" transform="rotate(120 37.2 48.5)"/>
  </g>
</svg>
